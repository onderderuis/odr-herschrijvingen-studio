<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>De Doorhaling — Onder de Ruis</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{font-family:"DM Sans",system-ui,sans-serif;background:#f4eee6;color:#2d2019}*{box-sizing:border-box}body{margin:0}main{max-width:1220px;margin:auto;padding:35px 24px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}.eyebrow{font-size:11px;letter-spacing:.25em;color:#745a49}h1{font-size:clamp(30px,4vw,46px);letter-spacing:-.045em;font-weight:500;margin:18px 0 4px}p{color:#7a6659;line-height:1.5}.tabs{display:flex;border:1px solid #d9c7b7;border-radius:10px;overflow:hidden}.tabs a{color:#3c2b21;text-decoration:none;padding:13px 16px;font-size:13px}.tabs a.active{background:#39251a;color:#f9f3ed}.layout{display:grid;grid-template-columns:minmax(280px,450px) minmax(320px,1fr);gap:28px;align-items:start;margin-top:25px}.preview{width:100%;max-width:450px;margin:auto}canvas{display:block;width:100%;height:auto;background:#f7f1e8;border:1px solid #cbb9a8}.meta{font-size:12px;color:#856d5b;display:flex;justify-content:space-between;margin-top:10px}.panel{padding:25px;background:#f8f2eb;border:1px solid #decfc1;border-radius:18px}label{display:block;font-size:13px;color:#513c2f;margin:0 0 8px}textarea,select{font:inherit;color:#2b1c14;background:#fffaf5;border:1px solid #cbb7a5;border-radius:9px;padding:12px;width:100%}textarea{min-height:74px;resize:vertical;margin-bottom:20px}select{font-size:14px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin:18px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}button{padding:13px 16px;border:1px solid #a9917f;border-radius:9px;background:transparent;color:#39251a;font:600 14px "DM Sans",sans-serif;cursor:pointer}button.primary{background:#39251a;color:#fff8f1;border-color:#39251a}.hint{font-size:12px;color:#897568}.sign{display:flex;gap:8px;align-items:center;font-size:13px}.sign input{accent-color:#39251a}[hidden]{display:none!important}@media(max-width:760px){main{padding:20px 15px}.layout{grid-template-columns:1fr}.preview{max-width:360px}.panel{padding:17px}.tabs a{padding:10px}}
</style></head><body><main><div class="top"><div class="eyebrow">ONDER DE RUIS / STUDIO</div><nav class="tabs"><a href="./">▶ De Herschrijving</a><a class="active" href="doorhaling.html">De Doorhaling</a></nav></div><h1>De Doorhaling.</h1><p>Een gedachte. Doorgestreept. En daarachter wat er vaak speelt.</p><div class="layout"><div class="preview"><canvas id="cv" width="1080" height="1350" aria-label="Voorvertoning van De Doorhaling"></canvas><div class="meta"><span id="dimension">INSTAGRAM · 1080 × 1350</span><span>PNG</span></div></div><section class="panel"><label for="mode">Variant</label><select id="mode" style="margin-bottom:20px"><option value="thought">Gedachte doorhalen</option><option value="word">Woord doorhalen</option></select><div id="thoughtFields"><label for="before">01 / Oorspronkelijke gedachte (doorgestreept)</label><textarea id="before">ik doe dit voor mezelf.</textarea><label for="after">02 / Wat er vaak achter zit</label><textarea id="after">ik doe dit om anderen niet teleur te stellen.</textarea></div><div id="wordFields" hidden><label for="sentence">Zin (zet [[dubbele haken]] om het door te halen gedeelte)</label><textarea id="sentence">ik ben [[te laat]] onderweg.</textarea><p class="hint">Alleen de tekst tussen [[ en ]] wordt doorgestreept.</p></div><div class="controls"><div><label for="format">Formaat</label><select id="format"><option value="portrait">Instagram 4:5</option><option value="square">Vierkant 1:1 / LinkedIn</option></select></div><div><label for="size">Tekstgrootte</label><select id="size"><option value="normal" selected>Normaal</option><option value="small">Bescheiden</option><option value="large">Groot</option></select></div><div><label for="strike">Doorhaling</label><select id="strike"><option value="single">Enkele lijn</option><option value="double">Dubbele lijn</option></select></div><div><label for="weight">Lijndikte</label><select id="weight"><option value="2">Subtiel</option><option value="3" selected>Normaal</option><option value="5">Stevig</option></select></div><div><label for="align">Uitlijning</label><select id="align"><option value="left">Links</option><option value="center">Gecentreerd</option></select></div><div><label for="space">Witruimte</label><select id="space"><option value="compact">Compact</option><option value="normal" selected>Normaal</option><option value="airy">Ruim</option></select></div></div><label class="sign"><input type="checkbox" id="signature" checked> Kleine ‘onder de ruis.’-signatuur</label><div class="actions"><button class="primary" id="download">↓ Exporteer afbeelding</button><button id="preview">Bekijk voorbeeld</button></div><p class="hint" id="status" role="status">Klaar voor een PNG-export op volledige resolutie.</p></section></div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');const fields=['before','after','sentence','mode','format','size','strike','weight','align','space','signature'];let ready=false;
function wrap(source,font,max){ctx.font='400 '+font+'px "DM Sans",system-ui,sans-serif';const words=source.trim().split(/\s+/).filter(Boolean);if(!words.length)return [''];const dp=Array(words.length+1).fill(Infinity),next=Array(words.length).fill(0);dp[words.length]=0;for(let i=words.length-1;i>=0;i--){for(let j=i;j<words.length;j++){const text=words.slice(i,j+1).join(' '),w=ctx.measureText(text).width;if(w>max)break;let rem=max-w,last=j===words.length-1;let cost=(last?0:rem*rem)+(last&&i===j&&i>0?600000:0)+dp[j+1];if(cost<dp[i]){dp[i]=cost;next[i]=j+1}}}if(!Number.isFinite(dp[0]))return null;let lines=[];for(let i=0;i<words.length;){const j=next[i];if(j<=i)return null;lines.push(words.slice(i,j).join(' '));i=j}return lines}

function drawWord(w,h){
 const source=$('sentence').value, match=source.match(/^(.*?)\[\[([\s\S]+?)\]\]([\s\S]*)$/);
 if(!match){$('status').textContent='Zet [[dubbele haken]] om het woord of zinsdeel dat je wilt doorhalen.';return false}
 const raw=(match[1]+match[2]+match[3]).replace(/\s+/g,' ').trim();
 const start=match[1].replace(/\s+/g,' ').length,end=start+match[2].length;
 const words=raw.split(' '),max=824;
 let font=+({small:54,normal:67,large:79}[$('size').value]),lines=[];
 for(;font>=38;font-=2){
  ctx.font='400 '+font+'px "DM Sans",system-ui,sans-serif';
  const measure=t=>ctx.measureText(t).width;
  lines=[];let line=[],offset=0;
  for(const word of words){
   const a=offset,b=a+word.length,segs=[];
   if(a<start)segs.push({text:word.slice(0,Math.min(word.length,start-a)),marked:false});
   if(b>start&&a<end)segs.push({text:word.slice(Math.max(0,start-a),Math.min(word.length,end-a)),marked:true});
   if(b>end)segs.push({text:word.slice(Math.max(0,end-a)),marked:false});
   if(!segs.length)segs.push({text:word,marked:false});
   const width=measure(word),existing=line.reduce((sum,x)=>sum+x.width,0)+(line.length?measure(' '):0);
   if(line.length&&existing+width>max){lines.push(line);line=[]}
   line.push({segs,width});offset=b+1;
  }
  if(line.length)lines.push(line);
  if(lines.length<=5&&lines.every(l=>l.reduce((sum,x)=>sum+x.width,0)+Math.max(0,l.length-1)*measure(' ')<=max))break;
 }
 if(lines.length>5){$('status').textContent='Deze zin is te lang. Maak de tekst korter.';return false}
 ctx.font='400 '+font+'px "DM Sans",system-ui,sans-serif';
 ctx.textBaseline='alphabetic';ctx.fillStyle='#4b3326';ctx.strokeStyle='#4b3326';ctx.lineWidth=+$('weight').value;
 const measure=t=>ctx.measureText(t).width,lineHeight=font*1.42,total=lines.length*lineHeight,y0=h/2-total/2+font*.7,center=$('align').value==='center';
 lines.forEach((line,i)=>{
  const totalWidth=line.reduce((sum,x)=>sum+x.width,0)+Math.max(0,line.length-1)*measure(' ');
  let x=center?(w-totalWidth)/2:128;const y=y0+i*lineHeight;
  line.forEach((word,wi)=>{
   word.segs.forEach(seg=>{
    if(!seg.text)return;
    ctx.textAlign='left';ctx.fillText(seg.text,x,y);
    const width=measure(seg.text);
    if(seg.marked){
     ctx.beginPath();ctx.moveTo(x,y-font*.31);ctx.lineTo(x+width,y-font*.31);ctx.stroke();
     if($('strike').value==='double'){ctx.beginPath();ctx.moveTo(x,y-font*.24);ctx.lineTo(x+width,y-font*.24);ctx.stroke()}
    }
    x+=width;
   });
   if(wi<line.length-1)x+=measure(' ');
  });
 });
 return font;
}
function draw(){const square=$('format').value==='square',w=1080,h=square?1080:1350;cv.width=w;cv.height=h;ctx.fillStyle='#f5efe6';ctx.fillRect(0,0,w,h);if($('mode').value==='word'){
 $('thoughtFields').hidden=true;$('wordFields').hidden=false;
 const font=drawWord(w,h);if(font===false)return;
 if($('signature').checked){ctx.textAlign='left';ctx.fillStyle='#745d4b';ctx.font='400 25px "DM Sans",system-ui,sans-serif';ctx.fillText('onder de ruis.',128,h-115)}
 $('dimension').textContent=square?'VIERKANT · 1080 × 1080':'INSTAGRAM · 1080 × 1350';
 $('status').textContent='Voorbeeld bijgewerkt · '+font+' px · PNG op volledige resolutie.';return;
}else{$('thoughtFields').hidden=false;$('wordFields').hidden=true}const x=$('align').value==='center'?w/2:128,max=824,alignment=$('align').value;let font=+({small:54,normal:67,large:79}[$('size').value]),first,second;for(;font>=38;font-=2){first=wrap($('before').value,font,max);second=wrap($('after').value,font,max);if(first&&second&&first.length<=4&&second.length<=5)break}if(!first||!second||first.length>4||second.length>5){$('status').textContent='De tekst is te lang voor dit formaat. Verkort een van de gedachten.';return}ctx.textAlign=alignment;ctx.textBaseline='alphabetic';const line=font*1.42,gap=({compact:75,normal:120,airy:175}[$('space').value]),block=(first.length+second.length-2)*line+gap+font*1.3;let y=(h-block)/2+font;ctx.font='400 '+font+'px "DM Sans",system-ui,sans-serif';ctx.fillStyle='#4b3326';let thick=+$('weight').value;for(const t of first){ctx.fillText(t,x,y);const width=ctx.measureText(t).width,from=alignment==='center'?x-width/2:x,to=alignment==='center'?x+width/2:x+width;ctx.strokeStyle='#4b3326';ctx.lineWidth=thick;ctx.beginPath();ctx.moveTo(from,y-font*.31);ctx.lineTo(to,y-font*.31);ctx.stroke();if($('strike').value==='double'){ctx.beginPath();ctx.moveTo(from,y-font*.24);ctx.lineTo(to,y-font*.24);ctx.stroke()}y+=line}y+=gap;for(const t of second){ctx.fillText(t,x,y);y+=line}if($('signature').checked){ctx.textAlign='left';ctx.fillStyle='#745d4b';ctx.font='400 25px "DM Sans",system-ui,sans-serif';ctx.fillText('onder de ruis.',128,h-115)}$('dimension').textContent=square?'VIERKANT · 1080 × 1080':'INSTAGRAM · 1080 × 1350';$('status').textContent='Voorbeeld bijgewerkt · '+font+' px · PNG op volledige resolutie.'}
fields.forEach(id=>$(id).addEventListener('input',draw));$('preview').onclick=draw;$('download').onclick=async()=>{await document.fonts.ready;draw();cv.toBlob(blob=>{if(!blob){$('status').textContent='PNG-export mislukt.';return}const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='ODR-De-Doorhaling-'+($('format').value==='square'?'1080x1080':'1080x1350')+'.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);$('status').textContent='PNG gedownload.'},'image/png')};draw();document.fonts.ready.then(()=>{ready=true;draw()});
})();
</script></body></html>
