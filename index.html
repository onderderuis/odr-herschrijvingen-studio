<!doctype html><html lang='nl'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>ODR Herschrijving Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#16110e;color:#e8ded1;font:16px system-ui}main{max-width:1100px;margin:auto;padding:32px 20px}h1{font-weight:500}p{color:#bca89a}.grid{display:grid;grid-template-columns:360px 1fr;gap:28px}canvas{width:100%;aspect-ratio:9/16;border:1px solid #513a2d}section{background:#251b16;padding:24px;border-radius:16px}label{display:block;margin:16px 0 8px}textarea,input{width:100%;padding:12px;border:1px solid #765747;background:#18110e;color:#eee3d8;border-radius:8px;font:inherit}button{background:#e8ded1;color:#241710;border:0;padding:13px 18px;border-radius:8px;font-weight:600;margin:18px 8px 0 0}small{color:#baa697}@media(max-width:740px){.grid{grid-template-columns:1fr}canvas{max-width:340px;display:block;margin:auto}}</style><main><p>ONDER DE RUIS / STUDIO</p><h1>De Herschrijving.</h1><div class='grid'><div><canvas id='cv' width='1080' height='1920'></canvas><p id='status'>Klaar om te beginnen.</p></div><section><label>Eerste gedachte</label><textarea id='before'>ik weet niet wat ik wil.</textarea><label>Herschreven gedachte</label><textarea id='after'>ik weet nog niet wat ik wil.</textarea><label>Typsnelheid (milliseconden per letter)</label><input id='speed' type='number' min='25' max='300' value='90'><label>Denkpauze (milliseconden)</label><input id='pause' type='number' min='500' max='5000' value='1900'><button id='play'>Bekijk animatie</button><button id='export'>Exporteer video</button><p><small>Export als WebM in ondersteunde browsers. Safari op iPhone ondersteunt deze opname mogelijk niet; gebruik daarvoor Chrome of Edge op een computer.</small></p></section></div></main><script>(()=>{'use strict';const $=x=>document.getElementById(x),cv=$('cv'),ctx=cv.getContext('2d');let busy=false;function config(){let a=Array.from($('before').value),b=Array.from($('after').value),p=0;while(p<a.length&&p<b.length&&a[p]===b[p])p++;return{a,b,p,s:Math.max(25,+$('speed').value||90),pause:Math.max(500,+$('pause').value||1900)}}function total(c){return c.a.length*c.s+c.pause+(c.a.length-c.p)*75+(c.b.length-c.p)*c.s+2200}function draw(t,c){let g=ctx.createRadialGradient(780,650,20,540,1000,1350);g.addColorStop(0,'#4a2e1f');g.addColorStop(.55,'#2b1b13');g.addColorStop(1,'#160f0c');ctx.fillStyle=g;ctx.fillRect(0,0,1080,1920);let x=c.a.length*c.s,y=x+c.pause,z=y+(c.a.length-c.p)*75;let a=t<x?c.a.slice(0,Math.floor(t/c.s)):t<y?c.a:t<z?c.a.slice(0,Math.max(c.p,c.a.length-Math.floor((t-y)/75))):c.b.slice(0,Math.min(c.b.length,c.p+Math.floor((t-z)/c.s)));ctx.font='54px system-ui';ctx.fillStyle='#eee3d8';let lines=[''];for(let word of a.join('').split(/(\s+)/)){let last=lines.length-1;if(ctx.measureText(lines[last]+word).width>790&&lines[last].trim())lines.push(word.trimStart());else lines[last]+=word}let top=850-(lines.length-1)*82/2;lines.forEach((line,i)=>ctx.fillText(line,135,top+i*82));if(Math.floor(t/450)%2===0){let last=lines[lines.length-1];ctx.fillRect(143+ctx.measureText(last).width,top+(lines.length-1)*82-48,3,64)}ctx.font='26px system-ui';ctx.fillStyle='#baa18c';ctx.fillText('onder de ruis.',135,1800)}async function animate(record){if(busy)return;let c=config();busy=true;$('play').disabled=true;$('export').disabled=true;$('status').textContent=record?'Video opnemen…':'Animatie afspelen…';let recorder,stream,parts=[];try{if(record){if(!cv.captureStream||!window.MediaRecorder)throw Error('Video-export wordt niet ondersteund door deze browser.');let mime=['video/mp4','video/webm;codecs=vp8','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime)throw Error('Geen geschikt exportformaat in deze browser.');stream=cv.captureStream(30);recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6000000});recorder.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};recorder.start(250)}await new Promise(resolve=>{let start=performance.now();function frame(now){let t=Math.min(now-start,total(c));draw(t,c);if(t<total(c))requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)});if(recorder){let done=new Promise(resolve=>recorder.onstop=resolve);recorder.stop();await done;let mime=recorder.mimeType,ext=mime.includes('mp4')?'mp4':'webm',url=URL.createObjectURL(new Blob(parts,{type:mime})),a=document.createElement('a');a.href=url;a.download='ODR-De-Herschrijving.'+ext;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}$('status').textContent=record?'Video gereed. Controleer Downloads.':'Animatie afgerond.'}catch(e){$('status').textContent=e.message}finally{if(stream)stream.getTracks().forEach(t=>t.stop());busy=false;$('play').disabled=false;$('export').disabled=false}}$('play').onclick=()=>animate(false);$('export').onclick=()=>animate(true);draw(total(config()),config())})();</script></html>
